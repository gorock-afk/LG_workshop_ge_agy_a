<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --theme-color: #A50034;
      --base-font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", Roboto, sans-serif;
      --sidebar-width: 290px;
      --code-theme-background: #0F172A;

</head>
<body>
  <div id="app">로딩 중...</div>
  <script>
    window.$docsify = {
      name: "LG · GE & Antigravity 2.0",
      repo: "",
      loadSidebar: false,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: "프롬프트, 커맨드(/grill-me), 키워드 검색...",
        noData: "검색 결과가 없습니다.",

        successText: "✅ 복사됨!"
      }
    };
  </script>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true });
    window.mermaid = mermaid;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
